<text x="668" y="60" font-size="22" font-weight="700" fill="#fff">VS Code window</text>
<text x="668" y="104" font-size="19" fill="#57606a">process</text>
<text x="770" y="104" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20">python  (the kernel)</text>
