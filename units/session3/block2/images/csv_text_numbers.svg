<text x="600" y="212" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1a7f37" font-weight="400" textLength="278.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">df.dtypes → order_id    int64</text>
<text x="600" y="238" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#cf222e" font-weight="400" textLength="288.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">             amount        str</text>
<text x="600" y="264" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#9aa4ae" font-weight="400" textLength="307.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">(an older pandas prints  object)</text>
<circle cx="40" cy="256" r="12" fill="#cf222e"/><text x="40" y="261" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="62" y="262" font-size="18" fill="#cf222e" font-weight="700" text-anchor="start">A currency sign and a thousands comma</text>
<text x="62" y="285" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">make 1200 a string. pandas loads it faithfully</text>
<text x="62" y="305" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">as text and says so in dtypes.</text>
<circle cx="40" cy="343" r="12" fill="#8250df"/><text x="40" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="62" y="349" font-size="18" fill="#8250df" font-weight="700" text-anchor="start">One dash for “missing”</text>
<text x="62" y="372" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">is not a spelling pandas knows; it stays text —</text>
<text x="62" y="392" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">and one text value makes the whole column text,</text>
<text x="62" y="412" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">830.50 included.</text>
<text x="600" y="300" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">The tell: a column that should be numeric says  str.</text>
<text x="600" y="326" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">Strip the symbols, declare the missing spelling (na_values), then convert.</text>
