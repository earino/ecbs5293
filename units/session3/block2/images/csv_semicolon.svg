<text x="610" y="71" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f2328" font-weight="700" textLength="115.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">id;name;city</text>
<rect x="600" y="82" width="250" height="34" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="610" y="105" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f2328" font-weight="400" textLength="124.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">1;Anna;Vienna</text>
<rect x="600" y="116" width="250" height="34" fill="#fff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="610" y="139" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#1f2328" font-weight="400" textLength="144.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">2;Bela;Budapest</text>
<text x="600" y="178" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#cf222e" font-weight="400" textLength="172.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">df.shape  → (2, 1)</text>
<text x="600" y="204" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#cf222e" font-weight="400" textLength="278.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">df.columns → ['id;name;city']</text>
<text x="600" y="230" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#cf222e" font-weight="400" textLength="192.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">no error, no warning</text>
<circle cx="40" cy="229" r="12" fill="#cf222e"/><text x="40" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="62" y="235" font-size="18" fill="#cf222e" font-weight="700" text-anchor="start">No commas found</text>
<text x="62" y="258" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">so every line is one field: one column,</text>
<text x="62" y="278" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">whose name is the whole header line. The</text>
<text x="62" y="298" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">next line of your code, df["name"], raises</text>
<text x="62" y="318" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">KeyError — and you go looking for a bug in</text>
<text x="62" y="338" font-size="15" fill="#57606a" font-weight="400" text-anchor="start">the code.</text>
<text x="600" y="300" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">The signature: one column where you expected several.</text>
<text x="600" y="324" font-size="16" fill="#57606a" font-weight="400" text-anchor="start">Learn to read it from the shape alone.</text>
</svg>
