<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#1f2328">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="30" y="20" width="660" height="330" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
<text x="50" y="50" font-size="19" fill="#57606a" font-weight="700" text-anchor="start">The page (.ipynb)</text>
<rect x="110" y="70" width="550" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="50" y="96" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f2328" font-weight="700" textLength="30.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[1]</text>
<text x="124" y="96" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f2328" font-weight="400" textLength="61.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">x = 10</text>
<rect x="110" y="122" width="550" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="50" y="148" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f2328" font-weight="700" textLength="30.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[2]</text>
<text x="124" y="148" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f2328" font-weight="400" textLength="91.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">y = x + 5</text>
<text x="124" y="170" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#1a7f37" font-weight="400" textLength="18.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">15</text>
<rect x="110" y="190" width="550" height="40" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="2"/>
<text x="50" y="216" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f2328" font-weight="700" textLength="30.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[3]</text>
<text x="124" y="216" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f2328" font-weight="400" textLength="61.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">x = 20</text>
<text x="650" y="216" font-size="14" fill="#bc4c00" font-weight="700" text-anchor="end">edited, then run again</text>
<rect x="730" y="20" width="420" height="330" rx="8" fill="#fbfdff" stroke="#0969da" stroke-width="2.5"/>
<text x="750" y="50" font-size="19" fill="#0969da" font-weight="700" text-anchor="start">The kernel (a running process)</text>
<text x="750" y="74" font-size="14" fill="#57606a" font-weight="400" text-anchor="start">what it remembers right now</text>
<text x="940" y="210" font-size="64" fill="#0969da" font-weight="700" text-anchor="middle">?</text>
<text x="940" y="250" font-size="15" fill="#57606a" font-weight="400" text-anchor="middle">predict, do not run</text>
<text x="30" y="384" font-size="18" fill="#1f2328" font-weight="700" text-anchor="start">Three runs, in this order. Cell 3 is cell 1, edited and run again. What is y in the kernel right now?</text>
