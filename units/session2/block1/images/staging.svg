<text x="446" y="184" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#1f2328" font-weight="400" textLength="184.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  new file:   notes.md</text>
