<path d="M 190,236 C 190,270 590,270 590,236" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="390" y="288" font-size="16" fill="#cf222e" font-weight="700" text-anchor="middle">git diff compares only these two. Staged work and new files are invisible to it.</text>
